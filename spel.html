<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelsida</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e9e9e9, #f4f4f4);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
        }

        .back-button {
            background: #6c8cff;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-button:hover {
            background: #5673ff;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-top: 10px;
        }

        h2 {
            color: #333;
            margin-top: 25px;
        }

        .money {
            text-align: center;
            font-size: 28px;
            color: green;
            font-weight: bold;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #6c8cff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 5px;
            font-size: 15px;
            transition: 0.2s;
        }

        button:hover {
            background: #5673ff;
        }

        .box {
            background: #eef3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 5px solid #6c8cff;
        }

        .dice-result {
            font-size: 28px;
            color: #6c8cff;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top-bar">
        <a class="back-button" href="index.html">← Gå tillbaka</a>
    </div>

    <h1>Spelsida</h1>

    <div class="money">
        Pengar: <span id="money">1000</span> kr
    </div>

    <h2>Kasta tärning</h2>

    <div class="box" style="text-align:center;">

        <button onclick="rollDice()" style="font-size:18px;">
            Kasta tärning🎲
        </button>

        <div id="diceResult" class="dice-result">
            -
        </div>

    </div>

    <h2>Betala skulder</h2>

    <div class="box">
        <button onclick="service()">Service -250 kr</button>
        <button onclick="kronofogden()">Kronofogden -750 kr</button>
        <button onclick="flygandeBes()">Flygande Bes -500 kr</button>
    </div>

    <h2>Sälj fordon</h2>

    <div class="box">
        <button onclick="sellBigCar()">Dyr bil/mc/moped +2000 kr</button>
        <button onclick="sellCheapCar()">Billig bil/mc/moped +500 kr</button>

        <button onclick="sellBigHouse()">Dyrt hus +2000 kr</button>
        <button onclick="sellCheapHouse()">Billigt hus +500 kr</button>
    </div>

    <h2>Händelse</h2>

    <div class="box">
        <p id="status">Ingen händelse ännu.</p>
    </div>

</div>

<script>

let money = 1000;

function updateMoney() {
    document.getElementById("money").innerText = money;

    if (money < 0) {
        document.getElementById("status").innerText =
        "Du har förlorat spelet!";
    }
}

function rollDice() {

    let dice = Math.floor(Math.random() * 6) + 1;

    document.getElementById("diceResult").innerText = dice;

    document.getElementById("status").innerText =
    "Du slog en " + dice + ".";
}

function service() {
    money -= 250;

    document.getElementById("status").innerText =
    "Service betald.";

    updateMoney();
}

function kronofogden() {
    money -= 750;

    document.getElementById("status").innerText =
    "Kronofogden tog pengar.";

    updateMoney();
}

function flygandeBes() {
    money -= 500;

    document.getElementById("status").innerText =
    "Flygande besiktning betalad.";

    updateMoney();
}

function sellBigCar() {
    money += 2000;

    document.getElementById("status").innerText =
    "Du sålde en dyr bil/mc/moped.";

    updateMoney();
}

function sellCheapCar() {
    money += 500;

    document.getElementById("status").innerText =
    "Du sålde en billig bil/mc/moped.";

    updateMoney();
}

function sellBigHouse() {
    money += 2000;

    document.getElementById("status").innerText =
    "Du sålde ett dyrt hus.";

    updateMoney();
}

function sellCheapHouse() {
    money += 500;

    document.getElementById("status").innerText =
    "Du sålde ett billigt hus.";

    updateMoney();
}

</script>
</body>
</html>
